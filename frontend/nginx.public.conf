server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "public demo healthy\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location = /icons.svg {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
