name: Cloud Coursework CI

on:
  push:
    branches:
      - codex/cloud-virtualization-coursework
  pull_request:
    paths:
      - frontend/**
      - backend/**
      - observability/**
      - compose.yaml
      - .github/workflows/cloud-coursework-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password-not-used
      MYSQL_USER: messmate_ci
      MYSQL_PASSWORD: ci-app-password-not-used
      JWT_SECRET: ci-only-jwt-secret-with-more-than-thirty-two-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate backend production dependencies
        working-directory: backend
        run: |
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=high

      - name: Validate Compose configuration
        run: docker compose --profile observability config --quiet

      - name: Build application images
        run: docker compose build frontend api
