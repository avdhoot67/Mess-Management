services:
  public-demo:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_READ_ONLY_DEMO: "true"
        VITE_LIVE_APP_URL: https://mess-management-ten-henna.vercel.app
        NGINX_CONFIG: nginx.public.conf
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  https:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    environment:
      MESSMATE_PUBLIC_HOST: ${MESSMATE_PUBLIC_HOST:-80.225.234.66.nip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.public-demo:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      public-demo:
        condition: service_healthy
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:
